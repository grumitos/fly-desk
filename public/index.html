<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fly Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%230e7490' d='M4 36l22-4 14 20 6-2-8-22 18-4c4-.9 6-5.1 5.1-9.1-.9-4-5.1-6-9.1-5.1l-18 4-17-16-6 2 11 20-22 4-7-8-4 1.3 4 12.6-4 12.6 4 1.3z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <svg class="ico ico--brand"><use href="#ico-plane"/></svg>
      <div class="topbar__brand-copy">
        <strong>Fly Desk</strong>
      </div>
    </div>

    <div class="topbar__meta">
      <div class="theme-switch" role="group" aria-label="Tema">
        <button type="button" class="theme-switch__button is-active" data-theme-value="light" aria-label="Tema claro" title="Tema claro">
          <svg class="theme-switch__icon" aria-hidden="true"><use href="#ico-sun"/></svg>
          <span class="sr-only">Claro</span>
        </button>
        <button type="button" class="theme-switch__button" data-theme-value="dark" aria-label="Tema oscuro" title="Tema oscuro">
          <svg class="theme-switch__icon" aria-hidden="true"><use href="#ico-moon"/></svg>
          <span class="sr-only">Oscuro</span>
        </button>
      </div>
      <span id="runtimeBadge" class="badge">IDLE</span>
      <span id="resultPill" class="badge badge--accent">0</span>
    </div>
  </header>

  <form id="searchForm" class="search-shell" novalidate autocomplete="off">
    <div class="search-rail">
      <section class="rail-segment rail-segment--stack" data-search-order="mode">
        <span class="field-label">Modo</span>
        <div class="segmented-control">
          <button type="button" class="segmented-control__button is-active" data-mode="exact">Exacto</button>
          <button type="button" class="segmented-control__button" data-mode="flexible">Flexible</button>
        </div>
        <select name="searchMode" id="searchMode" class="hidden">
          <option value="exact">Exacto</option>
          <option value="stay-range">Rango</option>
          <option value="roundtrip-grid">Matriz</option>
        </select>
      </section>

      <section class="rail-segment rail-segment--stack rail-segment--trip" data-search-order="trip">
        <span class="field-label">Trayecto</span>
        <div class="segmented-control segmented-control--wide" id="tripTypeControl">
          <button type="button" class="segmented-control__button is-active" data-trip="round-trip">Ida y vuelta</button>
          <button type="button" class="segmented-control__button" data-trip="one-way">Solo ida</button>
        </div>
        <select name="tripType" id="tripType" class="hidden">
          <option value="round-trip">Ida y vuelta</option>
          <option value="one-way">Solo ida</option>
        </select>
      </section>

      <label class="rail-segment rail-segment--field rail-segment--location" data-search-order="origin">
        <span class="field-label">Origen</span>
        <div class="field-shell">
          <input name="origin" id="origin" class="field-input field-input--code" autocomplete="off" spellcheck="false" placeholder="Ciudad o IATA" required />
        </div>
        <div id="originSuggestions" class="autocomplete-menu hidden"></div>
      </label>

      <button type="button" id="swapRouteBtn" class="icon-button icon-button--swap" data-search-order="swap" title="Intercambiar origen y destino">
        <svg class="ico"><use href="#ico-swap"/></svg>
      </button>

      <label class="rail-segment rail-segment--field rail-segment--location" data-search-order="destination">
        <span class="field-label">Destino</span>
        <div class="field-shell">
          <input name="destination" id="destination" class="field-input field-input--code" autocomplete="off" spellcheck="false" placeholder="Ciudad o IATA" required />
        </div>
        <div id="destinationSuggestions" class="autocomplete-menu hidden"></div>
      </label>

      <section class="rail-segment rail-segment--field rail-segment--dates" data-search-order="dates">
        <span class="field-label">Fechas</span>
        <button type="button" id="dateTrigger" class="field-button field-button--dates">
          <span id="dateTriggerText">Seleccionar fechas</span>
          <svg class="ico"><use href="#ico-calendar"/></svg>
        </button>
        <input name="departureDate" id="departureDate" type="hidden" />
        <input name="returnDate" id="returnDate" type="hidden" />
        <input name="departureStart" id="departureStart" type="hidden" />
        <input name="departureEnd" id="departureEnd" type="hidden" />
        <input name="returnStart" id="returnStart" type="hidden" />
        <input name="returnEnd" id="returnEnd" type="hidden" />
      </section>

      <section class="rail-segment rail-segment--field pax-wrapper" data-search-order="passengers">
        <span class="field-label">Pasajeros</span>
        <button type="button" id="paxTrigger" class="field-button field-button--pax">
          <span id="paxLabel">1 ADT</span>
          <svg class="ico ico--xs"><use href="#ico-chevron-down"/></svg>
        </button>
        <div id="paxPopover" class="pax-popover hidden">
          <div class="pax-popover__row">
            <span class="pax-popover__label">Adultos</span>
            <div class="pax-popover__controls">
              <button type="button" class="stepper-button" data-pax-action="adults-dec">&minus;</button>
              <span id="paxAdultsDisplay" class="pax-popover__value">1</span>
              <button type="button" class="stepper-button" data-pax-action="adults-inc">&plus;</button>
            </div>
          </div>
          <div class="pax-popover__row">
            <span class="pax-popover__label">Niños <span class="text-dim">(2-11)</span></span>
            <div class="pax-popover__controls">
              <button type="button" class="stepper-button" data-pax-action="children-dec">&minus;</button>
              <span id="paxChildrenDisplay" class="pax-popover__value">0</span>
              <button type="button" class="stepper-button" data-pax-action="children-inc">&plus;</button>
            </div>
          </div>
          <div class="pax-popover__row">
            <span class="pax-popover__label">Bebés <span class="text-dim">(&lt;2)</span></span>
            <div class="pax-popover__controls">
              <button type="button" class="stepper-button" data-pax-action="infants-dec">&minus;</button>
              <span id="paxInfantsDisplay" class="pax-popover__value">0</span>
              <button type="button" class="stepper-button" data-pax-action="infants-inc">&plus;</button>
            </div>
          </div>
        </div>
        <input name="adults" id="adults" type="hidden" value="1" />
        <input name="children" id="children" type="hidden" value="0" />
        <input name="infants" id="infants" type="hidden" value="0" />
      </section>

      <div class="rail-segment rail-segment--submit" data-search-order="submit">
        <button id="submitButton" class="btn btn--primary btn--search" type="submit">
          <svg class="ico ico--btn"><use href="#ico-search"/></svg>
          Buscar vuelos
        </button>
      </div>
    </div>

    <div class="search-shell__footer">
      <div class="search-refinements">
        <label class="refinement refinement--toggle">
          <input name="nonStop" id="nonStop" type="checkbox" />
          <span>Directo</span>
        </label>

        <label class="refinement refinement--toggle">
          <input name="baggageRequired" id="baggageRequired" type="checkbox" />
          <span>Con equipaje</span>
        </label>
      </div>

      <div class="search-shell__actions" role="group" aria-label="Configurar busqueda">
        <button type="button" id="copySearchConfigBtn" class="btn btn--secondary btn--sm search-shell__action" title="Copiar configuracion de busqueda">
          <svg class="ico ico--xs" aria-hidden="true"><use href="#ico-copy"/></svg>
          Copiar
        </button>
        <button type="button" id="pasteSearchConfigBtn" class="btn btn--secondary btn--sm search-shell__action" title="Pegar configuracion de busqueda">
          <svg class="ico ico--xs" aria-hidden="true"><use href="#ico-clipboard"/></svg>
          Pegar
        </button>
      </div>
    </div>

    <div id="calendarPopover" class="calendar-popover hidden" role="dialog" aria-modal="false" aria-label="Selector de fechas">
      <div class="calendar-popover__header">
        <div>
          <p class="calendar-popover__eyebrow">Calendario</p>
          <h2 id="calendarTitle" class="calendar-popover__title">Seleccionar fechas</h2>
        </div>
        <div class="calendar-popover__actions">
          <div class="calendar-nav" aria-label="Meses visibles">
            <button type="button" id="calendarPrev" class="icon-button icon-button--sm" title="Mes anterior">
              <svg class="ico"><use href="#ico-chevron-left"/></svg>
            </button>
            <button type="button" id="calendarNext" class="icon-button icon-button--sm" title="Mes siguiente">
              <svg class="ico"><use href="#ico-chevron-right"/></svg>
            </button>
          </div>
          <button type="button" id="calendarClose" class="icon-button icon-button--sm" title="Cerrar calendario">
            <svg class="ico" viewBox="0 0 16 16"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
      </div>

      <div class="calendar-popover__summary">
        <p id="calendarSelectionSummary" class="calendar-selection-summary">Selecciona una salida para empezar.</p>
        <div id="calendarStayConfig" class="calendar-stay hidden">
          <label class="calendar-stay__field">
            <span>Estadía mín.</span>
            <input name="stayDaysMin" id="stayDaysMin" type="number" class="calendar-stay__input" min="1" max="90" value="7" />
          </label>
          <label class="calendar-stay__field">
            <span>Estadía máx.</span>
            <input name="stayDaysMax" id="stayDaysMax" type="number" class="calendar-stay__input" min="1" max="90" value="14" />
          </label>
        </div>
      </div>

      <div id="calendarMonths" class="calendar-months"></div>

      <div class="calendar-popover__footer">
        <button type="button" id="calendarClear" class="btn btn--ghost btn--sm">Limpiar</button>
        <button type="button" id="calendarDone" class="btn btn--secondary btn--sm">Cerrar</button>
      </div>
    </div>

    <select name="sortMode" id="sortMode" class="hidden">
      <option value="cheapest">Precio</option>
      <option value="best-value">Valor</option>
      <option value="fastest">Duración</option>
    </select>
  </form>

  <div id="validationErrors" class="error-bar hidden"></div>

  <div class="workspace">
    <aside id="sidebar" class="workspace__sidebar"></aside>

    <main class="workspace__content">
      <div id="resultsToolbar" class="results-toolbar hidden">
        <div class="results-toolbar__left">
          <div class="results-toolbar__sort" id="sortButtons">
            <button type="button" class="results-toolbar__sort-btn is-active" data-sort="cheapest">Más barato</button>
            <button type="button" class="results-toolbar__sort-btn" data-sort="fastest">Más rápido</button>
            <button type="button" class="results-toolbar__sort-btn" data-sort="best-value">Mejor valor</button>
          </div>
          <span class="results-toolbar__count" id="resultsCountLabel"></span>
        </div>

        <div class="results-toolbar__right">
          <div class="results-toolbar__view" id="viewToggle">
            <button type="button" class="icon-button is-active" data-view="list" title="Vista lista">
              <svg class="ico" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3h12v1H2zm0 4h12v1H2zm0 4h12v1H2z"/></svg>
            </button>
            <button type="button" class="icon-button" data-view="calendar" title="Vista calendario">
              <svg class="ico" viewBox="0 0 16 16"><path fill="currentColor" d="M1 3h3v3H1zm5 0h3v3H6zm5 0h3v3h-3zM1 8h3v3H1zm5 0h3v3H6zm5 0h3v3h-3z"/></svg>
            </button>
          </div>
          <button type="button" class="icon-button hidden" id="matrixExpandBtn" title="Expandir matriz">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M2 6V2h4v1H3v3zm8-4h4v4h-1V3h-3zM2 10h1v3h3v1H2zm11 0h1v4h-4v-1h3z"/>
            </svg>
            <span class="sr-only">Expandir matriz</span>
          </button>
        </div>
      </div>

      <div id="resultsContainer" class="results-container">
        <div class="empty-state" id="emptyState">
          <div class="empty-state__icon">
            <svg class="ico" style="width:48px;height:48px"><use href="#ico-plane"/></svg>
          </div>
          <p class="empty-state__eyebrow">Sin consulta activa</p>
          <p class="empty-state__text">Completa una búsqueda para ver resultados.</p>
        </div>
      </div>
    </main>

    <aside id="detailPanel" class="workspace__detail">
      <div class="detail-panel__header">
        <div>
          <p class="detail-panel__eyebrow">Oferta</p>
          <h3 class="detail-panel__title">Detalle</h3>
        </div>
        <div class="detail-panel__actions">
          <button id="repriceButton" class="btn btn--secondary btn--sm" type="button" disabled>Reprice</button>
          <button id="quotationButton" class="btn btn--secondary btn--sm" type="button" disabled>Cotizar</button>
          <button id="detailClose" class="icon-button" type="button" title="Cerrar detalle">
            <svg class="ico" viewBox="0 0 16 16"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
      </div>
      <div id="detailContent" class="detail-panel__body"></div>
    </aside>
  </div>

  <div id="matrixFullscreen" class="matrix-fullscreen hidden" aria-hidden="true">
    <button type="button" class="matrix-fullscreen__backdrop" id="matrixFullscreenBackdrop" aria-label="Cerrar matriz expandida"></button>
    <section class="matrix-fullscreen__panel" role="dialog" aria-modal="true" aria-labelledby="matrixFullscreenTitle">
      <div class="detail-panel__header matrix-fullscreen__header">
        <div>
          <p class="detail-panel__eyebrow">Calendario</p>
          <h3 id="matrixFullscreenTitle" class="detail-panel__title">Matriz expandida</h3>
        </div>
        <div class="detail-panel__actions">
          <span id="matrixFullscreenMeta" class="badge badge--accent">0 celdas</span>
          <button type="button" id="matrixFullscreenClose" class="icon-button" title="Cerrar matriz expandida">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.5"/></svg>
            <span class="sr-only">Cerrar matriz expandida</span>
          </button>
        </div>
      </div>
      <div id="matrixFullscreenBody" class="matrix-fullscreen__body"></div>
    </section>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="ico-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
    </symbol>
    <symbol id="ico-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>
    </symbol>
    <symbol id="ico-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </symbol>
    <symbol id="ico-route" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>
    </symbol>
    <symbol id="ico-luggage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 20h0a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h0"/><path d="M8 18V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v14"/><path d="M10 20h4"/><circle cx="16" cy="20" r="2"/><circle cx="8" cy="20" r="2"/>
    </symbol>
    <symbol id="ico-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
    </symbol>
    <symbol id="ico-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>
    </symbol>
    <symbol id="ico-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="ico-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 18-6-6 6-6"/>
    </symbol>
    <symbol id="ico-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6"/>
    </symbol>
    <symbol id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4.25"/>
      <path d="M12 2.5v2.5"/><path d="M12 19v2.5"/><path d="m4.93 4.93 1.77 1.77"/><path d="m17.3 17.3 1.77 1.77"/><path d="M2.5 12H5"/><path d="M19 12h2.5"/><path d="m4.93 19.07 1.77-1.77"/><path d="m17.3 6.7 1.77-1.77"/>
    </symbol>
    <symbol id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7.2 7.2 0 0 0 10.7 10.7Z"/>
    </symbol>
    <symbol id="ico-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="11" height="11" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="ico-clipboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="4" width="14" height="18" rx="2"/>
      <path d="M9 4V2h6v2"/>
      <path d="M9 8h6"/>
    </symbol>
  </svg>

  <script src="/app.js" defer></script>
</body>
</html>
