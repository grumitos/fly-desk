name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy an exact main revision or roll back to an existing release.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      revision:
        description: Exact 40-character Git SHA to deploy or restore.
        required: true
        type: string
      public_smoke_url:
        description: Public URL to smoke after activation.
        required: true
        default: https://fly-desk.pages.dev/login
        type: string

permissions:
  contents: read

concurrency:
  group: fly-desk-vps-deploy
  cancel-in-progress: false

env:
  APP_NAME: fly-desk
  RELEASE_WRAPPER: /usr/local/bin/vps-release-fly-desk

jobs:
  deploy:
    name: Validate and deploy revision
    if: ${{ inputs.mode == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    steps:
      - name: Validate revision input
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          printf '%s' "$REVISION" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "revision must be a lowercase 40-character Git SHA."
            exit 1
          }

      - name: Checkout main history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require revision on main
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          git cat-file -e "$REVISION^{commit}"
          git merge-base --is-ancestor "$REVISION" HEAD || {
            echo "Only revisions reachable from origin/main may be deployed."
            exit 1
          }
          git checkout --detach "$REVISION"
          test "$(git rev-parse HEAD)" = "$REVISION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate application
        run: |
          set -euo pipefail
          bun run typecheck
          bun run lint
          bun run build
          bun run test
        env:
          FLY_DESK_TEST_BROWSER_CHANNEL: chrome

      - name: Build release artifact
        id: artifact
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/fly-desk-package"
          artifact="$RUNNER_TEMP/fly-desk-$REVISION.tar.gz"
          rm -rf "$package_root"
          install -d -m 0755 "$package_root/app"
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='frontend/node_modules/' \
            --exclude='output/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            ./ "$package_root/app/"
          printf '%s\n' "$REVISION" > "$package_root/app/REVISION"
          tar -C "$package_root" -czf "$artifact" app
          digest="$(sha256sum "$artifact" | awk '{print $1}')"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"
          : "${VPS_SSH_KEY_B64:?VPS_SSH_KEY_B64 is required}"
          : "${VPS_SSH_KNOWN_HOSTS_B64:?VPS_SSH_KNOWN_HOSTS_B64 is required}"
          port="${VPS_PORT:-22}"
          printf '%s' "$port" | grep -Eq '^[0-9]+$'
          test "$port" -ge 1 && test "$port" -le 65535
          printf '%s' "$VPS_USER" | grep -Eq '^[A-Za-z0-9._-]+$'
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/vps_app_key
          printf '%s' "$VPS_SSH_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps_app_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/vps_app_key >/dev/null
          known_host="$VPS_HOST"
          if [ "$port" != 22 ]; then known_host="[$VPS_HOST]:$port"; fi
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null
          cat > ~/.ssh/config <<EOF
          Host vps-app
            HostName $VPS_HOST
            User $VPS_USER
            Port $port
            IdentityFile ~/.ssh/vps_app_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload immutable artifact
        env:
          REVISION: ${{ inputs.revision }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          incoming="/var/lib/vps-app-release/incoming/$APP_NAME/$REVISION"
          ssh vps-app "umask 077; install -d -m 0700 '$incoming'"
          scp "$ARTIFACT_PATH" "vps-app:$incoming/artifact.tar.gz.upload"
          ssh vps-app "mv '$incoming/artifact.tar.gz.upload' '$incoming/artifact.tar.gz'"

      - name: Activate revision
        env:
          REVISION: ${{ inputs.revision }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          set -euo pipefail
          ssh vps-app "sudo -n '$RELEASE_WRAPPER' deploy '$REVISION' '$ARTIFACT_DIGEST'"

      - name: Public smoke
        env:
          PUBLIC_SMOKE_URL: ${{ inputs.public_smoke_url }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLIC_SMOKE_URL" | grep -Eq '^https://[^[:space:]]+$'
          status="$(curl -sS -o /dev/null -w '%{http_code}' --location --retry 5 --retry-delay 5 --max-time 20 "$PUBLIC_SMOKE_URL")"
          case "$status" in
            200) ;;
            403) echo "::warning::Public smoke returned the expected regional 403 from the hosted runner." ;;
            *) echo "Public smoke failed with HTTP $status."; exit 1 ;;
          esac

  rollback:
    name: Roll back revision
    if: ${{ inputs.mode == 'rollback' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Validate revision input
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          printf '%s' "$REVISION" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "revision must be a lowercase 40-character Git SHA."
            exit 1
          }

      - name: Configure pinned SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"
          : "${VPS_SSH_KEY_B64:?VPS_SSH_KEY_B64 is required}"
          : "${VPS_SSH_KNOWN_HOSTS_B64:?VPS_SSH_KNOWN_HOSTS_B64 is required}"
          port="${VPS_PORT:-22}"
          printf '%s' "$port" | grep -Eq '^[0-9]+$'
          test "$port" -ge 1 && test "$port" -le 65535
          printf '%s' "$VPS_USER" | grep -Eq '^[A-Za-z0-9._-]+$'
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/vps_app_key
          printf '%s' "$VPS_SSH_KNOWN_HOSTS_B64" | base64 -d > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vps_app_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/vps_app_key >/dev/null
          known_host="$VPS_HOST"
          if [ "$port" != 22 ]; then known_host="[$VPS_HOST]:$port"; fi
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null
          cat > ~/.ssh/config <<EOF
          Host vps-app
            HostName $VPS_HOST
            User $VPS_USER
            Port $port
            IdentityFile ~/.ssh/vps_app_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Activate existing release
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          ssh vps-app "sudo -n '$RELEASE_WRAPPER' rollback '$REVISION'"

      - name: Public smoke
        env:
          PUBLIC_SMOKE_URL: ${{ inputs.public_smoke_url }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLIC_SMOKE_URL" | grep -Eq '^https://[^[:space:]]+$'
          status="$(curl -sS -o /dev/null -w '%{http_code}' --location --retry 5 --retry-delay 5 --max-time 20 "$PUBLIC_SMOKE_URL")"
          case "$status" in
            200) ;;
            403) echo "::warning::Public smoke returned the expected regional 403 from the hosted runner." ;;
            *) echo "Public smoke failed with HTTP $status."; exit 1 ;;
          esac
