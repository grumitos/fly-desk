name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Bun quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run playwright install --with-deps chromium

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Typecheck
        run: bun run typecheck

      - name: Lint if configured
        run: |
          set -euo pipefail
          if bun -e "const pkg = await Bun.file('package.json').json(); process.exit(pkg.scripts?.lint ? 0 : 1)"; then
            bun run lint
          else
            echo "No lint script configured; skipping."
          fi

      - name: Build frontend for tests
        run: bun run build

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
