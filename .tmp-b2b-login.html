<script type="text/javascript">
function checkForm() {
    form = document.getElementById('loginform');
    if (form.email.value == '') {
        form.email.focus();
        return false;
    }
    if (form.password.value == '') {
        form.password.focus();
        return false;
    }
    return true;
}
$( document ).ready(function() {
	// $('#email,#password').attr('autocomplete','chrome-off');
	// $.cacheImage('/temp/bg/beach-1824855.jpg');
    $('#preloadersearchhotel').cacheImage();
    $('#preloadersearchair').cacheImage();
	$("#email,#password").click(function () { $(this).select(); });
	$('#loginform').disableAutoFill({ passwordField: '.password', callback: function() { return checkForm(); } });
	$('#email').keypress(function(e) { if (e.which == 13) { if ($('#password').val()=="") { $('#password').focus(); } else {  $("#btnsubmit").click(); } } } );
	$('#password').keypress(function(e) { if (e.which == 13) { $("#btnsubmit").click(); } });
});
</script>
